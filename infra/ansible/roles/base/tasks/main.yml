---
- name: Base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Time sync is enabled (the Pi has no clock battery)
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Journald drop-in folder
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Journald size limits (fewer SD-card writes)
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/10-bajeti.conf
    mode: "0644"
    owner: root
    group: root
  notify: Restart journald

- name: Memory cgroup on the kernel command line (Docker memory limits need it; reboot to apply)
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    regexp: '^((?!.*cgroup_enable=memory).*)$'
    line: '\1 cgroup_enable=memory cgroup_memory=1'
    backrefs: true
  when: "'app' in group_names"

- name: Read the current address settings of the wired connection
  ansible.builtin.command: >-
    nmcli -g ipv4.method,ipv4.addresses,ipv4.gateway,ipv4.dns
    connection show "{{ base_static_connection }}"
  register: base_nm_current
  changed_when: false
  check_mode: false
  when: "'app' in group_names and base_static_address | length > 0"

- name: Fixed address on the wired connection (takes effect at the next reconnect or reboot)
  ansible.builtin.command: >-
    nmcli connection modify "{{ base_static_connection }}"
    ipv4.method manual ipv4.addresses {{ base_static_address }}
    ipv4.gateway {{ base_static_gateway }} ipv4.dns {{ base_static_dns }}
  when:
    - "'app' in group_names and base_static_address | length > 0"
    - base_nm_current.stdout_lines != ['manual', base_static_address, base_static_gateway, base_static_dns]
  changed_when: true
