---
# Creates one folder on the existing SSD mount. It never formats or partitions anything.
- name: Refuse to create the folder unless the SSD is mounted
  ansible.builtin.assert:
    that: ansible_facts['mounts'] | selectattr('mount', 'equalto', backup_mount) | list | length > 0
    fail_msg: "{{ backup_mount }} is not mounted; refusing to write backups into the root filesystem."
    quiet: true

- name: Backups folder on the existing mount (exFAT ignores the mode; age encryption is the protection)
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: "{{ storage_backup_user }}"
    group: "{{ storage_backup_user }}"
    mode: "0770"
