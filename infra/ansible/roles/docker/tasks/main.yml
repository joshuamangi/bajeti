---
- name: Refuse to install an unpinned Docker
  ansible.builtin.assert:
    that: "'<' not in docker_package_version"
    fail_msg: Set docker_package_version in group_vars/all/main.yml (see infra/README.md).
    quiet: true

- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    owner: root
    group: root

- name: Docker apt repository for this Debian release
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch_map[ansible_facts['architecture']] }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Docker engine and compose plugin (pinned)
  ansible.builtin.apt:
    name:
      - "docker-ce={{ docker_package_version }}"
      - "docker-ce-cli={{ docker_package_version }}"
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: Restart docker

- name: Log rotation (fewer SD-card writes)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
    owner: root
    group: root
  notify: Restart docker

- name: Users allowed to run docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Docker enabled at boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
