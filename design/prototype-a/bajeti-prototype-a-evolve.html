/* =====================================================================
   Bajeti PWA prototype · shared styles
   Tokens mirror app/static/css/palette.css. Dark set on :root, light set
   on .light (toggled on <html> and <body>). Values marked ADJUSTED were
   darkened/lightened only to reach 4.5:1 text contrast; names unchanged.
   ===================================================================== */
:root{
  --bg-dark:hsl(220 35% 5%);
  --bg:hsl(220 25% 8%);
  --bg-light:hsl(220 20% 12%);
  --text:hsl(210 40% 96%);
  --text-muted:hsl(210 15% 70%);
  --highlight:hsl(180 25% 62%);            /* ADJUSTED 45% -> 62% */
  --border:hsl(220 15% 25%);
  --border-muted:hsl(220 15% 18%);         /* ADJUSTED 15% -> 18% so bar tracks show */
  --primary:hsl(190 80% 70%);
  --primary-ink:hsl(190 80% 70%);          /* NEW TOKEN: primary for text and filled buttons */
  --secondary:hsl(38 80% 65%);
  --tertiary:hsl(280 45% 72%);             /* ADJUSTED 65% -> 72% */
  --success:hsl(155 55% 55%);
  --warning:hsl(42 80% 60%);
  --danger:hsl(4 70% 64%);                 /* ADJUSTED 60% -> 64% */
  --info:hsl(210 70% 68%);
  --shadow:0 2px 3px hsla(0,0%,0%,.25),0 4px 6px hsla(0,0%,0%,.15);
  --shadow-inset:inset 0 1px 3px hsla(0,0%,0%,.35);   /* NEW TOKEN: engraved pill */
  --scrim:hsla(220,35%,5%,.6);             /* NEW TOKEN: was rgba(0,0,0,.5) */
  --tint:hsla(190,80%,70%,.14);            /* NEW TOKEN: soft selected background */
  --gradient:linear-gradient(180deg,var(--bg),var(--bg-light));
  --gradient-hover:linear-gradient(180deg,var(--bg-light),var(--bg));
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --h1:500 1.5rem/1.25;--h2:500 1.25rem/1.4;--h3:500 1.125rem/1.5;--h4:500 1rem/1.5;
  --p:400 .875rem/1.75;--small:400 .75rem/1.6;--tiny:400 .625rem/1.6;
  --space-1:.4em;--space-2:.8em;--space-3:1.2em;--space-4:1.6em;--space-5:2em;--space-6:2.4em; /* NEW TOKEN */
  --r-bar:.2em;--r:.4em;--r-item:.6em;--r-modal:.75rem; /* NEW TOKEN: names for radii already in use */
  --tap:44px;                              /* NEW TOKEN: minimum touch target */
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
  --tabbar-h:4em;                          /* NEW TOKEN */
  color-scheme:dark;
}
:root.light,body.light{
  --bg-dark:hsl(210 40% 93%);
  --bg:hsl(210 40% 97%);
  --bg-light:hsl(210 40% 100%);
  --text:hsl(220 25% 10%);
  --text-muted:hsl(220 10% 38%);
  --highlight:hsl(180 35% 28%);            /* ADJUSTED 45% -> 28% */
  --border:hsl(220 15% 70%);
  --border-muted:hsl(220 25% 84%);
  --primary:hsl(190 90% 35%);
  --primary-ink:hsl(190 90% 27%);          /* NEW TOKEN (light): 5.3:1 on white */
  --secondary:hsl(40 85% 32%);             /* ADJUSTED 45% -> 32% */
  --tertiary:hsl(280 45% 45%);             /* ADJUSTED 60% -> 45% */
  --success:hsl(155 60% 28%);              /* ADJUSTED */
  --warning:hsl(36 90% 32%);               /* ADJUSTED */
  --danger:hsl(4 70% 42%);                 /* ADJUSTED */
  --info:hsl(210 70% 40%);                 /* ADJUSTED */
  --shadow:0 1px 2px hsla(220,25%,10%,.12),0 3px 6px hsla(220,25%,10%,.08);
  --shadow-inset:inset 0 1px 3px hsla(220,25%,10%,.18);
  --scrim:hsla(220,25%,10%,.45);
  --tint:hsla(190,90%,35%,.1);
  --gradient:linear-gradient(180deg,var(--bg),var(--bg-light));
  --gradient-hover:linear-gradient(180deg,var(--bg-light),var(--bg));
  color-scheme:light;
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg-dark)}
body{margin:0;font:var(--p) var(--font);color:var(--text-muted);background:var(--bg-dark);min-height:100dvh;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{color:var(--text);margin:0}
h1{font:var(--h1) var(--font)}h2{font:var(--h2) var(--font)}h3{font:var(--h3) var(--font)}h4{font:var(--h4) var(--font)}
p{margin:0}
a{color:var(--primary-ink)}
b,strong{color:var(--text);font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--primary-ink);outline-offset:2px}
#pMain:focus{outline:none}
.p-visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.p-small{font:var(--small) var(--font)}
.p-tiny{font:var(--tiny) var(--font)}
.p-muted{color:var(--text-muted)}
.p-center{text-align:center}
.p-lead{color:var(--text-muted);margin-top:-.8em}
.p-negative{color:var(--danger)!important}
.p-positive{color:var(--success)}
.p-up{color:var(--danger)}
.p-down{color:var(--success)}
.d-none{display:none!important}
.p-skip{position:fixed;left:.8em;top:-4em;z-index:200;background:var(--bg-light);color:var(--text);padding:.8em 1.2em;border-radius:var(--r);box-shadow:var(--shadow)}
.p-skip:focus{top:calc(.8em + var(--safe-top))}

/* ===== App container: one breakpoint (768px) via container query so the phone frame works ===== */
#pApp{container-type:inline-size;container-name:app;min-height:100dvh;position:relative}

/* ===== Header (inverted on purpose) ===== */
.p-header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.4em;background:var(--text);color:var(--bg-light);
  min-height:calc(4em + var(--safe-top));padding:var(--safe-top) calc(.4em + var(--safe-right)) 0 calc(.8em + var(--safe-left));box-shadow:var(--shadow)}
.p-header-left{flex:1;display:flex;align-items:center;gap:.4em;min-width:0}
.p-header-right{display:flex;align-items:center;gap:.4em}
.p-logo{font:500 1.75rem/1 var(--font);color:var(--bg-light);text-decoration:none;letter-spacing:-.01em;padding:.4em 0}
.p-header-title{font:600 1rem/1.25 var(--font);color:var(--bg-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-hbtn{min-width:var(--tap);min-height:var(--tap);display:inline-grid;place-items:center;border-radius:var(--r);color:var(--bg-light);font-size:1.125rem}
.p-hbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--bg-light) 18%,transparent)}
body.p-bare .p-header,body.p-bare .p-tabbar,body.p-bare .p-fab{display:none}

/* ===== Banners (offline, sync, update) ===== */
#pBanners:empty{display:none}
.p-banner{display:flex;align-items:center;gap:.8em;min-height:var(--tap);padding:.4em calc(.8em + var(--safe-right)) .4em calc(1.2em + var(--safe-left));font:500 .8125rem/1.4 var(--font);color:var(--text);border-bottom:1px solid var(--border-muted)}
.p-banner>span{flex:1}
.p-banner-offline{background:var(--bg-light);box-shadow:inset .4em 0 0 var(--warning)}
.p-banner-offline i{color:var(--warning)}
.p-banner-sync{background:var(--bg-light);box-shadow:inset .4em 0 0 var(--info)}
.p-banner-update{background:var(--tint);box-shadow:inset .4em 0 0 var(--primary-ink)}
.p-banner button{min-height:var(--tap);padding:0 .8em;font-weight:700;color:var(--primary-ink)}
.p-banner .p-hbtn{color:var(--text-muted)}

/* ===== Install hint (bottom, above tab bar) ===== */
#pInstall:empty{display:none}
.p-install{position:relative;margin:.8em calc(.8em + var(--safe-right)) 0 calc(.8em + var(--safe-left));display:flex;gap:.8em;align-items:flex-start;
  background:var(--bg-light);color:var(--text);border:1px solid var(--border-muted);border-radius:var(--r-item);padding:.8em .4em .8em 1.2em;box-shadow:var(--shadow);font:var(--small) var(--font)}
.p-install>i{font-size:1.5rem;color:var(--primary-ink);margin-top:.4em}
.p-install-body{flex:1;display:flex;flex-direction:column;gap:.4em}
.p-install-body p{color:var(--text-muted)}
.p-install-actions{display:flex;gap:.4em;margin-top:.4em}
.p-install .p-hbtn{color:var(--text-muted)}

/* ===== Main and page scaffolding ===== */
#pMain{display:block;max-width:1200px;margin:0 auto;padding:.8em calc(.8em + var(--safe-right)) calc(var(--tabbar-h) + 4em + var(--safe-bottom)) calc(.8em + var(--safe-left))}
body.p-bare #pMain{padding-bottom:2.4em}
.p-page{display:flex;flex-direction:column;gap:1.2em}
.p-page-head{display:flex;align-items:center;justify-content:space-between;gap:.8em}
.p-section-head{display:flex;align-items:center;justify-content:space-between;gap:.8em;margin-bottom:.8em}
/* Section labels follow the live app: regular weight, muted, a little larger */
.p-section-head h2{font:500 1.125rem/1.4 var(--font);color:var(--text-muted);display:flex;align-items:center;gap:.4em}
.p-card .p-section-head h2,.p-modal .p-section-head h2{font:500 1rem/1.4 var(--font);color:var(--text)}
/* Actions keep a 44px tap area without stretching the row */
.p-section-head>.p-link,.p-section-head>.p-btn-ghost,.p-section-head>.p-btn-primary,.p-section-head>.p-row-actions{margin-block:-.6em}
/* NEW COMPONENT: block = heading + content with one even gap */
.p-block{display:flex;flex-direction:column;gap:.8em}
.p-block>.p-section-head{margin:0}
/* From the live app: thick grey bar between dashboard sections */
.p-divider{display:block;height:.4em;margin:.4em 0;border:0;border-radius:var(--r-bar);background:var(--border-muted)}
.p-cur{font-size:.7em;font-weight:600;letter-spacing:.02em;color:var(--text-muted);vertical-align:.1em}
#pSnackBar .p-cur{color:inherit}
.p-group-title{font:600 .75rem/1.6 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:0 0 .4em .4em}
.p-count{display:inline-grid;place-items:center;min-width:1.6em;padding:0 .4em;font:700 .75rem/1.6 var(--font);color:var(--text);background:var(--bg-light);border:1px solid var(--border-muted);border-radius:999px}
.p-card{background:var(--gradient);border-radius:var(--r);box-shadow:var(--shadow);padding:1.2em}
.p-card>.p-section-head:first-child{margin-top:-.4em}

/* ===== Title card ===== */
.p-title-card{display:flex;align-items:flex-end;justify-content:space-between;gap:.8em;margin:-.8em calc(-.8em - var(--safe-right)) 0 calc(-.8em - var(--safe-left));padding:1.2em calc(.8em + var(--safe-right)) 1.2em calc(.8em + var(--safe-left));background:var(--gradient);box-shadow:var(--shadow)}
.p-title-card p{color:var(--text-muted);margin-top:.4em}
.p-eye-toggle{display:grid;place-items:center;width:3.2em;height:var(--tap);flex:none;border-radius:var(--r);border:2px solid var(--primary-ink);color:var(--primary-ink);background:var(--bg-light);box-shadow:var(--shadow);font-size:1.125rem}
.p-eye-toggle[aria-pressed="true"]{background:var(--tint)}
.p-refresh{display:inline-flex;align-items:center;gap:.4em;min-height:var(--tap);padding:0 .8em;border-radius:var(--r);font:var(--small) var(--font);color:var(--text-muted);border:1px solid var(--border-muted);background:var(--bg-light)}

/* ===== Alerts ===== */
.p-alert-warning,.p-alert-error{display:flex;align-items:flex-start;gap:.8em;padding:.8em .4em .8em 1.2em;border-radius:var(--r);color:var(--text);background:var(--bg-light);box-shadow:var(--shadow)}
.p-alert-warning{box-shadow:inset .4em 0 0 var(--warning),var(--shadow)}
.p-alert-warning>i{color:var(--warning);margin-top:.4em}
.p-alert-error{box-shadow:inset .4em 0 0 var(--danger),var(--shadow)}
.p-alert-error>i{color:var(--danger);margin-top:.4em}
.p-alert-warning p,.p-alert-error p{flex:1}
.p-alert-close{min-width:var(--tap);min-height:var(--tap);font-size:1.25rem;color:var(--text-muted);margin:-.8em 0}

/* ===== Buttons ===== */
.p-btn-primary,.p-btn-ghost,.p-btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:var(--tap);padding:0 1.2em;border-radius:var(--r);font:500 .875rem/1.2 var(--font);text-decoration:none;white-space:nowrap}
.p-btn-primary{background:var(--primary-ink);color:var(--bg-light);box-shadow:var(--shadow)}
.p-btn-ghost{background:var(--bg-light);color:var(--primary-ink);border:1px solid var(--border-muted);box-shadow:var(--shadow)}
.p-btn-danger{background:var(--bg-light);color:var(--danger);border:1px solid currentColor}
.p-btn-block{width:100%}
.p-btn-icon{width:var(--tap);padding:0}
.p-link,.p-link-btn{display:inline-flex;align-items:center;gap:.4em;min-height:var(--tap);color:var(--primary-ink);font-weight:600;text-decoration:none}
.p-link-btn{text-decoration:underline;text-underline-offset:2px}
.p-actions-btns{display:inline-grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:var(--r);background:var(--bg-light);border:1px solid currentColor;box-shadow:var(--shadow);flex:none}
.p-actions-btns-primary{color:var(--primary-ink)}.p-actions-btns-secondary{color:var(--secondary)}.p-actions-btns-warning{color:var(--warning)}
.p-actions-btns-tertiary{color:var(--tertiary)}.p-actions-btns-danger{color:var(--danger)}.p-actions-btns-info{color:var(--info)}
[class*="p-icon-btn-"]{display:inline-grid;place-items:center;min-width:var(--tap);min-height:var(--tap);border-radius:var(--r);background:var(--bg-light);box-shadow:var(--shadow);font-size:.8rem;flex:none}
.p-icon-btn-primary{color:var(--primary-ink)}.p-icon-btn-secondary{color:var(--secondary)}.p-icon-btn-warning{color:var(--warning)}
.p-icon-btn-tertiary{color:var(--tertiary)}.p-icon-btn-danger{color:var(--danger)}.p-icon-btn-info{color:var(--info)}
.p-row-actions{display:inline-flex;gap:.4em;flex:none}
[class*="p-modal-btn-"]{display:flex;align-items:center;justify-content:center;gap:.4em;width:100%;min-height:var(--tap);padding:.4em .8em;border-radius:var(--r);background:var(--bg-light);box-shadow:var(--shadow);font:500 .875rem/1.3 var(--font);text-align:center;flex-wrap:wrap}
[class*="p-modal-btn-"] small{display:block;width:100%;font:var(--tiny) var(--font);color:var(--text-muted)}
.p-modal-btn-primary{background:var(--primary-ink);color:var(--bg-light)}
.p-modal-btn-primary small{color:inherit;opacity:.85}
.p-modal-btn-secondary{color:var(--text)}.p-modal-btn-tertiary{color:var(--tertiary)}.p-modal-btn-warning{color:var(--warning)}
.p-modal-btn-danger{color:var(--danger)}.p-modal-btn-info{color:var(--primary-ink)}
.p-budget-create-btn{display:inline-grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:50%;border:2px solid var(--primary-ink);color:var(--primary-ink);background:var(--bg-light);box-shadow:var(--shadow);font-size:1.125rem;flex:none}
@media (pointer:fine){.p-actions-btns{width:32px;height:32px}[class*="p-icon-btn-"]{min-width:2.4em;min-height:2.4em}}
@media (hover:hover){
  .p-category-item:hover,.p-admin-card:hover{transform:scale(1.02)}
  .p-btn-primary:hover,.p-modal-btn-primary:hover{filter:brightness(1.08)}
  .p-list-row:hover{background:var(--tint)}
}

/* ===== Tags, badges, switches, segmented ===== */
.p-tag{display:inline-flex;align-items:center;gap:.4em;padding:0 .8em;min-height:1.6em;border-radius:999px;font:600 .6875rem/1.4 var(--font);color:var(--text);background:var(--bg-dark);border:1px solid var(--border-muted);white-space:nowrap}
.p-tag-primary{color:var(--primary-ink);border-color:currentColor;background:var(--tint)}
.p-tag-info{color:var(--info);border-color:currentColor}
.p-tag-warning{color:var(--warning);border-color:currentColor}
.p-tag-success{color:var(--success);border-color:currentColor}
.p-tag-danger{color:var(--danger);border-color:currentColor}
.p-badge{position:absolute;top:.4em;left:calc(50% + .4em);display:grid;place-items:center;min-width:1.6em;height:1.6em;padding:0 .4em;border-radius:999px;background:var(--danger);color:var(--bg-light);font:700 .6875rem/1 var(--font);border:2px solid var(--bg-light)}
.p-badge-inline{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;padding:0 .4em;border-radius:999px;background:var(--danger);color:var(--bg-light);font:700 .75rem/1 var(--font)}
.p-chip-pending{display:inline-flex;align-items:center;gap:.4em;padding:0 .4em;border-radius:var(--r);font:700 .6875rem/1.6 var(--font);color:var(--info);border:1px dashed currentColor;white-space:nowrap}
/* NEW COMPONENT: switch (role=switch, shows On/Off text so state is not colour only) */
.p-switch{display:inline-flex;align-items:center;gap:.4em;min-height:var(--tap);flex:none}
.p-switch-track{position:relative;width:3em;height:1.6em;border-radius:999px;background:var(--border);transition:background .2s}
.p-switch-track::after{content:"";position:absolute;top:.2em;left:.2em;width:1.2em;height:1.2em;border-radius:50%;background:var(--bg-light);box-shadow:var(--shadow);transition:transform .2s}
.p-switch[aria-checked="true"] .p-switch-track{background:var(--primary-ink)}
.p-switch[aria-checked="true"] .p-switch-track::after{transform:translateX(1.4em)}
.p-switch-text{font:700 .75rem/1 var(--font);color:var(--text-muted);min-width:2em}
/* NEW COMPONENT: segmented control */
.p-segmented{display:inline-flex;padding:.4em;gap:.4em;background:var(--bg-dark);border-radius:var(--r-item);border:1px solid var(--border-muted)}
.p-segmented button{min-height:36px;padding:0 1.2em;border-radius:var(--r);font-weight:600;color:var(--text-muted)}
.p-segmented button[aria-pressed="true"]{background:var(--bg-light);color:var(--text);box-shadow:var(--shadow)}

/* ===== Budget switcher (NEW COMPONENT) ===== */
.p-budget-switch{display:flex;gap:.8em;overflow-x:auto;padding:.4em .4em .8em;margin:0 -.4em;scroll-snap-type:x mandatory;scrollbar-width:none}
.p-budget-switch::-webkit-scrollbar{display:none}
.p-budget-switch{padding:.4em;margin:-.4em}
.p-switch-chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:.8em;min-height:3.6em;padding:.4em 1.6em .4em 1.2em;border-radius:var(--r-item);background:var(--gradient);border:1px solid transparent;box-shadow:var(--shadow);text-align:left;color:var(--text);font-weight:500}
.p-switch-chip-text{display:flex;flex-direction:column;line-height:1.3}
.p-switch-chip-type{font:var(--tiny) var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.p-switch-radio{display:grid;place-items:center;width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--border)}
.p-switch-radio::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary-ink);transform:scale(0);transition:transform .2s}
.p-switch-chip[aria-checked="true"]{border-color:var(--primary-ink)}
.p-switch-chip[aria-checked="true"] .p-switch-radio{border-color:var(--primary-ink)}
.p-switch-chip[aria-checked="true"] .p-switch-radio::before{transform:scale(1)}

.p-scope{display:flex;flex-direction:column;gap:.4em}
.p-scope-label{font:500 .75rem/1.6 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}

/* ===== Summary cards ===== */
.p-summary-card{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.p-summary-cards{display:flex;flex-direction:column;align-items:center;gap:.4em;min-width:0;padding:1.2em .8em;text-align:center;background:var(--gradient);border-radius:var(--r);box-shadow:var(--shadow)}
.p-summary-label{font:400 1rem/1.4 var(--font);color:var(--text-muted)}
.p-summary-value{font:var(--h2) var(--font);font-weight:500;color:var(--success);white-space:nowrap}
.p-summary-cards .p-small{color:var(--text-muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* NEW COMPONENT: meter under summary */
.p-meter{display:flex;flex-direction:column;gap:.8em;padding:1.2em;background:var(--gradient);border-radius:var(--r);box-shadow:var(--shadow)}
.p-meter-top,.p-meter-foot{display:flex;justify-content:space-between;gap:.8em;white-space:nowrap}
.p-meter-top{color:var(--text-muted)}
.p-meter-top b{color:var(--text);font-weight:500}
.p-meter-foot{font:var(--small) var(--font)}
.p-meter-foot>span:first-child{overflow:hidden;text-overflow:ellipsis}
.p-meter-foot>span{display:inline-flex;align-items:center;gap:.4em}
.p-pace{display:inline-flex;align-items:center;gap:.4em;font-weight:600}
.p-pace.ok{color:var(--success)}.p-pace.warn{color:var(--secondary)}.p-pace.bad{color:var(--danger)}
.p-meter .p-pace{font:500 .8125rem/1.4 var(--font)}
.p-meter-track{position:relative}
.p-progress-lg{height:10px;border-radius:var(--r)}
.p-progress-lg .p-progress-fill{border-radius:var(--r)}
/* NEW COMPONENT: today marker (where the month is) on the overall bar */
.p-today-mark{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--bg-light)}
.p-today-key{display:inline-block;width:2px;height:.9em;border-radius:2px;background:var(--text)}
/* NEW COMPONENT: category bar chart, one slim row per category, most used first */
.p-catbars{background:var(--gradient);border-radius:var(--r);box-shadow:var(--shadow);padding:.8em .4em .4em}
.p-catbars-note{font:var(--small) var(--font);color:var(--text-muted);padding:0 .8em .4em}
.p-catbars-list{list-style:none;margin:0;padding:0}
.p-catbars-list>li+li{border-top:1px solid var(--border-muted)}
.p-catbar{display:flex;flex-direction:column;justify-content:center;gap:.4em;width:100%;min-height:3.2em;padding:.4em .8em;border-radius:var(--r);text-align:left}
.p-catbar:active{background:var(--tint)}
.p-catbar-top{display:flex;align-items:baseline;gap:.8em;min-width:0}
.p-catbar-top .p-category-name{flex:1}
.p-catbar-pct{font:var(--small) var(--font);color:var(--text-muted);min-width:2.8em;text-align:right}
.p-catbar-top .p-category-status{min-width:6.4em;text-align:right}
.p-catbar .p-progress-bar{height:6px}
.p-catbars-more{display:flex;align-items:center;justify-content:center;gap:.4em;width:100%;min-height:var(--tap);margin-top:.4em;border-top:1px solid var(--border-muted);color:var(--primary-ink);font-weight:500}
@media (hover:hover){.p-catbar:hover{background:var(--tint)}}

/* ===== Category tiles ===== */
.p-category-progress-list{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.p-category-item{display:flex;flex-direction:column;gap:.8em;width:100%;padding:1.2em .8em;text-align:left;background:var(--gradient);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .2s;min-height:var(--tap)}
.p-category-header{display:flex;justify-content:space-between;align-items:baseline;gap:.4em;min-width:0}
.p-category-name{color:var(--text);font-weight:500;font-size:.9375rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-category-status{font-size:.8125rem;white-space:nowrap;flex:none}
.p-category-status.ok{color:var(--success)}.p-category-status.exceeded{color:var(--danger)}.p-category-status.zero{color:var(--secondary)}
.p-progress-wrapper{display:flex;align-items:center;gap:.8em}
.p-progress-bar{display:block;flex:1 1 auto;min-width:0;height:6px;border-radius:var(--r-bar);background:var(--border-muted);overflow:hidden}
.p-progress-fill{display:block;height:100%;border-radius:var(--r-bar);transition:width .4s ease}
.p-ok-fill{background:var(--success)}.p-exceeded-fill{background:var(--danger)}.p-zero-fill{background:var(--secondary)}
.p-target-fill{background:var(--tertiary)}  /* NEW COMPONENT */
.p-progress-percent{font:var(--small) var(--font);min-width:3.6em;text-align:right;color:var(--text-muted)}
/* NEW COMPONENT: category list row (used by B) */
.p-category-rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8em}
.p-category-row{display:grid;grid-template-columns:1fr auto;gap:.4em 1.2em;align-items:center;width:100%;padding:.8em 1.2em;text-align:left;background:var(--bg-light);border-radius:var(--r);box-shadow:var(--shadow);min-height:3.6em}
.p-category-row .p-progress-bar{grid-column:1 / -1}
.p-category-row-sub{grid-column:1 / -1;display:flex;justify-content:space-between;font:var(--small) var(--font)}

/* ===== Desktop table ===== */
.p-table-wrap{display:none;overflow-x:auto;background:var(--bg-light);border-radius:var(--r);box-shadow:var(--shadow)}
.p-table{width:100%;border-collapse:collapse;font-size:.875rem}
.p-table th,.p-table td{padding:.8em 1.2em;text-align:left;border-bottom:1px dashed var(--border-muted);vertical-align:middle}
.p-table thead th{color:var(--highlight);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;border-bottom-style:solid}
.p-table tbody th{color:var(--text);font-weight:600}
.p-table .p-num{text-align:right;white-space:nowrap}
.p-table-actions{display:flex;gap:.4em;justify-content:flex-end}
.p-a11y-table{margin-top:1.2em}
.p-a11y-table summary{min-height:var(--tap);display:flex;align-items:center;color:var(--primary-ink);font-weight:600;cursor:pointer}
.p-a11y-table .p-table{background:var(--bg-light);border-radius:var(--r)}

/* ===== Lists and wells ===== */
.p-category-progress-ul{list-style:none;margin:0;padding:0 .8em;background:var(--bg-dark);border-radius:var(--r)}
.p-category-progress-li{display:flex;align-items:center;justify-content:space-between;gap:.8em;min-height:3.2em;padding:.8em 0;border-bottom:1px solid var(--border-muted);font-size:.875rem;color:var(--text)}
.p-category-progress-li:last-child{border-bottom:0}
.p-category-progress-li>span:first-child{display:flex;flex-direction:column;min-width:0;flex:1}
.p-category-progress-li small{font:var(--small) var(--font);color:var(--text-muted);display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
.p-category-progress-no-content{padding:1.2em;text-align:center;background:var(--bg-dark);border-radius:var(--r);font-size:.8125rem;color:var(--text-muted)}
.p-category-progress-transfer-divider{border-top:1px solid var(--border-muted);padding-top:1.2em;margin-top:1.2em;display:flex;flex-direction:column;gap:.8em}
.p-category-progress-transfer-divider h4{font:600 .9375rem/1.4 var(--font);display:flex;align-items:center;gap:.4em}
.p-list{list-style:none;margin:0;padding:0;background:var(--bg-light);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.p-list>li{border-bottom:1px solid var(--border-muted)}
.p-list>li:last-child{border-bottom:0}
.p-list-row{display:flex;align-items:center;gap:.8em;width:100%;min-height:3.6em;padding:.8em 1.2em;color:var(--text);text-decoration:none;text-align:left}
.p-list-icon{display:grid;place-items:center;width:2.4em;height:2.4em;flex:none;border-radius:var(--r);background:var(--tint);color:var(--primary-ink)}
.p-list-main{flex:1;min-width:0;display:flex;flex-direction:column}
.p-list-sub{font:var(--small) var(--font);color:var(--text-muted)}
.p-chev{color:var(--text-muted);font-size:.75rem}

/* ===== Empty, loading, error states ===== */
.p-empty{display:flex;flex-direction:column;align-items:center;gap:.8em;padding:2.4em 1.6em;text-align:center;background:var(--bg-dark);border:1px dashed var(--border);border-radius:var(--r)}
.p-empty>i{font-size:2em;color:var(--primary-ink)}
.p-empty h3{font:600 1rem/1.4 var(--font)}
.p-empty p{max-width:28em}
.p-skel{border-radius:var(--r);background:linear-gradient(90deg,var(--border-muted) 0%,var(--bg-light) 50%,var(--border-muted) 100%);background-size:200% 100%;animation:p-shimmer 1.2s linear infinite}
@keyframes p-shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.p-skel-wrap{display:flex;flex-direction:column;gap:1.2em}
.p-skel-title{height:4.8em}.p-skel-line{height:1.6em;width:60%}
.p-skel-row{display:grid;grid-template-columns:1fr 1fr;gap:.8em}.p-skel-card{height:6.4em}
.p-skel-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8em}.p-skel-tile{height:5.6em}
.p-state-error{display:flex;flex-direction:column;align-items:center;gap:.8em;padding:2.4em 1.6em;text-align:center;background:var(--bg-light);border-radius:var(--r);box-shadow:inset 0 .4em 0 var(--danger),var(--shadow)}
.p-state-error>i{font-size:2em;color:var(--danger)}

/* ===== Modal / bottom sheet ===== */
.p-modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;transition:opacity .2s}
.p-modal.open{opacity:1}
.p-modal-content{width:100%;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);color:var(--text-muted);border-radius:var(--r-modal) var(--r-modal) 0 0;padding:.8em calc(1.2em + var(--safe-right)) calc(2em + var(--safe-bottom)) calc(1.2em + var(--safe-left));box-shadow:var(--shadow);transform:translateY(100%);transition:transform .25s ease}
.p-modal.open .p-modal-content{transform:none}
.p-modal-content:focus{outline:none}
.p-sheet-grip{width:2.4em;height:4px;margin:0 auto .8em;border-radius:4px;background:var(--border)}
.p-modal-head{display:flex;align-items:center;justify-content:space-between;gap:.8em;margin-bottom:1.2em}
.p-modal-limit-name{font:600 1.125rem/1.4 var(--font);padding:.4em 1.2em;border-radius:var(--r-item);background:var(--gradient);box-shadow:var(--shadow-inset);overflow-wrap:anywhere}
.p-close{display:grid;place-items:center;width:var(--tap);height:var(--tap);flex:none;border-radius:var(--r);color:var(--text);font-size:1.25rem}
.p-modal-body{display:flex;flex-direction:column;gap:1.2em}
.p-modal-body>p{color:var(--text)}
body.p-modal-open{overflow:hidden}

/* ===== Forms ===== */
.p-modal-form-content{display:flex;flex-direction:column;gap:1.2em;padding:1.2em;background:var(--bg-dark);border-radius:var(--r)}
.p-field{display:flex;flex-direction:column;gap:.4em;color:var(--text);font-weight:500;min-width:0}
.p-field>span{display:flex;align-items:center;gap:.4em}
.p-field input,.p-field select,.p-field textarea,.p-input{width:100%;min-height:var(--tap);padding:0 .8em;font-size:16px;color:var(--text);background:var(--bg-light);border:1px solid var(--border);border-radius:var(--r)}
.p-field textarea,textarea.p-input{padding:.8em;resize:vertical;line-height:1.5}
.p-field input[readonly],.p-field select:disabled{background:var(--bg);color:var(--text-muted)}
.p-field input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.p-form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.p-fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:.8em;min-width:0}
.p-fieldset[hidden]{display:none}
.p-fieldset legend{color:var(--text);font-weight:600;padding:0;margin-bottom:.8em}
.p-error-text{color:var(--danger);font:600 .75rem/1.6 var(--font);min-height:0}
.p-error-text:empty{display:none}
.p-inline-note{display:flex;gap:.8em;align-items:flex-start;padding:.8em 1.2em;border-radius:var(--r);background:var(--bg-light);color:var(--text);box-shadow:inset .4em 0 0 var(--info);font-size:.8125rem}
.p-check{display:flex;align-items:center;gap:.8em;min-height:var(--tap);color:var(--text)}
.p-check input,.p-radio-card input{width:20px;height:20px;accent-color:var(--primary-ink);flex:none}
.p-radio-card{display:flex;gap:.8em;align-items:flex-start;padding:.8em 1.2em;border:1px solid var(--border-muted);border-radius:var(--r);background:var(--bg-light);color:var(--text)}
.p-radio-card:has(input:checked){border-color:var(--primary-ink);background:var(--tint)}
.p-radio-card span{display:flex;flex-direction:column}
.p-radio-card small{color:var(--text-muted);font:var(--small) var(--font)}
.p-inline-row{display:grid;grid-template-columns:1fr 1fr var(--tap);gap:.4em}
.p-inline-row input{min-height:var(--tap);padding:0 .8em;font-size:16px;border:1px solid var(--border-muted);border-radius:4px;background:var(--bg-light);min-width:0}
.p-inline-submit{display:grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:4px;background:var(--primary-ink);color:var(--bg-light)}
/* values-hidden also masks amounts typed into money inputs while not focused */
.p-values-hidden .p-money-input:not(:focus){-webkit-text-security:disc;text-security:disc}

/* NEW COMPONENT: amount-first field */
.p-amount-field{display:flex;align-items:baseline;justify-content:center;gap:.4em;padding:1.2em .8em;background:var(--bg-dark);border-radius:var(--r);border:1px solid var(--border-muted)}
.p-amount-field:focus-within{border-color:var(--primary-ink);box-shadow:0 0 0 1px var(--primary-ink)}
.p-amount-field input{width:100%;max-width:7em;border:0;background:transparent;text-align:center;font:600 2.4rem/1.2 var(--font);color:var(--text);outline:none}
.p-amount-cur{font:700 1rem/1 var(--font);color:var(--text-muted)}
/* NEW COMPONENT: category chips (radio) */
.p-chip-group{font:700 .6875rem/1.6 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-top:.4em}
.p-chips{display:flex;flex-wrap:wrap;gap:.4em}
.p-chip{position:relative}
.p-chip input{position:absolute;inset:0;opacity:0;margin:0}
.p-chip>span{display:flex;flex-direction:column;justify-content:center;min-height:var(--tap);padding:.4em .8em;border-radius:var(--r-item);border:1px solid var(--border-muted);background:var(--bg-light);color:var(--text);cursor:pointer}
.p-chip small{font:var(--tiny) var(--font);color:var(--text-muted)}
.p-chip input:checked+span{border-color:var(--primary-ink);background:var(--tint);box-shadow:inset 0 0 0 1px var(--primary-ink)}
.p-chip input:checked+span b::before{content:"\2713 ";color:var(--primary-ink)}
.p-chip input:focus-visible+span{outline:2px solid var(--primary-ink);outline-offset:2px}
/* NEW COMPONENT: first-letter filter in Add expense (shown when there are more than 8 categories).
   Only letters that categories start with are shown, so every button keeps a 44px target. */
.p-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tap),1fr));gap:.4em}
.p-letter{min-height:var(--tap);border-radius:var(--r);background:var(--bg-light);border:1px solid var(--border-muted);box-shadow:var(--shadow);color:var(--text);font:500 1rem/1 var(--font)}
.p-letter-all{grid-column:span 2;font-size:.875rem}
.p-letter[aria-pressed="true"]{background:var(--primary-ink);border-color:var(--primary-ink);color:var(--bg-light)}
.p-search-count{font:var(--small) var(--font);color:var(--text-muted);margin-top:-.4em}
.p-search-count:empty{display:none}
.p-chip-block{display:flex;flex-direction:column;gap:.4em}
.p-chip-group i{margin-right:.2em}
.p-chip[hidden],.p-chip-block[hidden]{display:none}
.p-chip.is-picked>span{border-color:var(--primary-ink);background:var(--tint)}
.p-sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.p-sheet-actions-3{grid-template-columns:repeat(3,1fr)}
.p-sheet-actions-1{grid-template-columns:1fr}

/* ===== Category sheet ===== */
.p-cat-sheet-top{display:flex;justify-content:space-between;align-items:flex-end;gap:.8em}
.p-cat-sheet-top>div{display:flex;flex-direction:column}
.p-big{font:600 1.5rem/1.25 var(--font)}
.p-cat-sheet-meta{align-items:flex-end;text-align:right}

/* ===== Budget lists ===== */
.p-budget-cols{display:grid;grid-template-columns:1fr;gap:1.6em}
.p-budget-title{display:flex;align-items:center;justify-content:space-between;gap:.8em;margin-bottom:.8em}
.p-budget-title h3{font:600 1rem/1.4 var(--font);color:var(--text-muted)}
.p-budget-total{padding:.4em .8em;border-radius:var(--r);background:var(--border-muted);color:var(--text);font:600 .8125rem/1.2 var(--font);white-space:nowrap}
.p-budget-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8em}
.p-budget-item{display:flex;align-items:center;gap:.8em;padding:.4em .4em .4em 1.2em;min-height:3.6em;border-radius:var(--r-item);background:var(--gradient);box-shadow:var(--shadow)}
.p-budget-item label{flex:1;display:flex;align-items:center;gap:.8em;min-height:var(--tap);color:var(--text);cursor:pointer}
.p-budget-item input[type=radio]{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex:none}
.p-budget-item input[type=radio]::before{content:"";width:14px;height:14px;border-radius:50%;transform:scale(0);background:var(--primary-ink);transition:transform .2s}
.p-budget-item input[type=radio]:checked{border-color:var(--primary-ink)}
.p-budget-item input[type=radio]:checked::before{transform:scale(1)}
.p-budget-item.active{box-shadow:inset 0 0 0 1px var(--primary-ink),var(--shadow)}
.p-budget-item-sub{display:block;font:var(--small) var(--font);color:var(--text-muted)}

/* ===== Allocation summary and bar ===== */
.p-alloc-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;padding:.8em;background:var(--bg-dark);border-radius:var(--r);text-align:center}
.p-alloc-summary span{display:block;font:var(--small) var(--font);color:var(--text-muted)}
.p-alloc-summary strong{font-size:.875rem}
.p-alloc-amt{color:var(--text);font-weight:600;white-space:nowrap}
/* NEW COMPONENT: stacked allocation bar with legend */
.p-alloc-bar{display:flex;height:12px;border-radius:var(--r-bar);overflow:hidden;background:var(--border-muted);gap:2px}
.p-alloc-seg{display:block;height:100%}
.p-legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.4em 1.2em;font:var(--small) var(--font)}
.p-legend li{display:flex;align-items:center;gap:.4em;justify-content:space-between;color:var(--text)}
.p-legend li>span:first-child{display:flex;align-items:center;gap:.4em;min-width:0}
.p-swatch{width:.8em;height:.8em;border-radius:2px;flex:none}
.c1{background:var(--primary)}.c2{background:var(--secondary)}.c3{background:var(--tertiary)}.c4{background:var(--info)}.c5{background:var(--success)}.c6{background:var(--warning)}.c0{background:var(--border)}

/* ===== Targets ===== */
.p-target-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8em}
.p-target-li{padding:.8em 1.2em;background:var(--bg-dark);border-radius:var(--r);display:flex;flex-direction:column;gap:.8em}
.p-target-head{display:flex;align-items:center;justify-content:space-between;gap:.8em}
.p-target-term{display:flex;flex-direction:column;gap:.4em}
.p-target-term-head{display:flex;justify-content:space-between;gap:.8em;font:var(--small) var(--font);color:var(--text)}
.p-target-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;padding:.8em;background:var(--bg-dark);border-radius:var(--r);text-align:center;margin-bottom:.8em}
.p-target-total-label{display:block;font-size:.8em;color:var(--text-muted)}
.p-target-total-value{display:block;font-size:.9em;font-weight:700;color:var(--text)}
.p-target-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}

/* ===== Due strip (NEW COMPONENT) ===== */
.p-due-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:.8em}
.p-due-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.4em .8em;padding:1.2em;background:var(--gradient);border-radius:var(--r);box-shadow:var(--shadow);height:100%}
.p-due-name{color:var(--text);font-weight:500;font-size:.9375rem}
.p-due-meta{font:var(--small) var(--font);min-width:0}
.p-due-amount{color:var(--text);font-weight:500;text-align:right}
.p-due-actions{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1.6fr;gap:.8em;margin-top:.4em}
/* NEW COMPONENT: pending payments row */
.p-pending-row{display:flex;align-items:center;gap:.8em;min-height:3.6em;padding:.8em 1.2em;background:var(--bg-light);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:var(--text)}
.p-pending-row>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.p-pending-icon{display:grid;place-items:center;width:2.4em;height:2.4em;border-radius:var(--r);background:var(--tint);color:var(--primary-ink)}

/* ===== Analytics (NEW COMPONENTS) ===== */
.p-month-nav{display:flex;align-items:center;justify-content:space-between;gap:.8em}
.p-month-title{font:var(--h2) var(--font);text-align:center;flex:1}
.p-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.p-stat{display:flex;flex-direction:column;gap:.4em;padding:1.2em;background:var(--gradient);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.p-stat:first-child{grid-column:1 / -1}
.p-stat-label{font:700 .6875rem/1.4 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.p-stat-value{font:600 1.25rem/1.25 var(--font);display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.p-stat:first-child .p-stat-value{font-size:1.75rem}
.p-trend-plot{position:relative;height:11em;display:flex;align-items:stretch;gap:.8em;margin:0 0 2em;border-bottom:1px solid var(--border)}
.p-trend-col{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.4em;min-width:var(--tap);border-radius:var(--r) var(--r) 0 0}
.p-trend-bar{display:block;width:min(100%,3.2em);border-radius:var(--r) var(--r) 0 0;background:var(--border);transition:height .4s ease}
.p-trend-col.is-active .p-trend-bar{background:var(--primary-ink)}
.p-trend-val{font:700 .6875rem/1 var(--font);color:var(--text);white-space:nowrap}
.p-trend-label{position:absolute;bottom:-1.8em;font:600 .75rem/1 var(--font);color:var(--text-muted)}
.p-trend-col.is-active .p-trend-label{color:var(--text)}
.p-trend-col.is-active .p-trend-label::after{content:" \25CF";color:var(--primary-ink)}
.p-trend-budget{position:absolute;left:0;right:0;border-top:2px dashed var(--secondary);pointer-events:none;z-index:1}
.p-trend-budget span{position:absolute;right:0;top:-1.6em;font:700 .6875rem/1.4 var(--font);color:var(--secondary);background:var(--bg-light);padding:0 .4em;border-radius:var(--r)}
.p-breakdown{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4em}
.p-breakdown-row{position:relative;display:flex;flex-direction:column;gap:.4em;width:100%;padding:.8em 2.4em .8em .8em;text-align:left;border-radius:var(--r);min-height:var(--tap)}
.p-breakdown-row:active{background:var(--tint)}
.p-breakdown-top,.p-breakdown-meta{display:flex;justify-content:space-between;gap:.8em}
.p-breakdown-amt{color:var(--text);font-weight:700}
.p-breakdown-meta{font:var(--small) var(--font)}
.p-breakdown-chev{position:absolute;right:.8em;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.75rem}
.p-crumbs{display:flex;align-items:center;gap:.8em;flex-wrap:wrap;font-weight:600}
.p-crumbs a{min-height:var(--tap);display:inline-flex;align-items:center}
.p-crumbs i{font-size:.625rem;color:var(--text-muted)}
.p-crumbs [aria-current]{color:var(--text)}

/* NEW COMPONENT: Analytics period switch (Month / 6 months / Year) */
.p-period{display:grid;grid-template-columns:repeat(3,1fr)}
.p-period a{display:grid;place-items:center;min-height:var(--tap);border-radius:var(--r);font-weight:500;color:var(--text-muted);text-decoration:none}
.p-period a[aria-current="page"]{background:var(--bg-light);color:var(--text);box-shadow:var(--shadow)}
/* NEW COMPONENT: squeezed-category insights */
.p-insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8em}
.p-insight{display:flex;flex-direction:column;gap:.4em;padding:.8em 1.2em;border-radius:var(--r);background:var(--bg-dark);color:var(--text-muted);text-decoration:none}
.p-insight-top{display:flex;justify-content:space-between;align-items:center;gap:.8em}
.p-insight-tip{display:flex;align-items:center;gap:.4em;font:500 .8125rem/1.4 var(--font);color:var(--primary-ink)}
/* NEW COMPONENT: month-by-month heat table (a real table, so it reads as one) */
.p-heat-wrap{overflow-x:auto;margin:0 -.4em}
.p-heat{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;font-size:.75rem}
.p-heat thead th{font:600 .6875rem/1.4 var(--font);color:var(--text-muted);text-align:center;padding:0 0 .4em}
.p-heat thead th:first-child{width:7.6em}
.p-heat tbody th{text-align:left;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:.4em}
.p-heat tbody th a{color:var(--text);text-decoration:none;display:block;min-height:2.8em;line-height:2.8em;overflow:hidden;text-overflow:ellipsis}
.p-heat td{position:relative;height:2.8em;text-align:center;border-radius:var(--r);background:var(--bg-dark);color:var(--text)}
.p-heat td.is-tight,.p-heat-sw.is-tight{background:color-mix(in srgb,var(--secondary) 22%,var(--bg-light))}
.p-heat td.is-over,.p-heat-sw.is-over{background:color-mix(in srgb,var(--danger) 22%,var(--bg-light))}
.p-heat td.is-over{font-weight:600}
.p-heat td.is-empty{color:var(--text-muted);background:transparent;border:1px dashed var(--border-muted)}
.p-heat-up{margin-left:.2em;color:var(--danger)}
.p-topup,.p-topup-key{font:700 .75rem/1 var(--font);color:var(--tertiary)}
.p-topup{position:absolute;top:2px;right:4px}
.p-heat-key{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4em 1.2em;font:var(--small) var(--font)}
.p-heat-key li{display:inline-flex;align-items:center;gap:.4em}
.p-heat-key .fa-caret-up{color:var(--danger)}
.p-heat-sw{width:1.2em;height:1.2em;border-radius:4px;display:inline-block}
.p-two{display:grid;grid-template-columns:1fr;gap:1.2em}
.p-two .p-group-title{margin-bottom:.8em}
/* Year list reuses the slim category rows */
.p-year-list{margin:0 -.8em}
.p-year-list .p-catbar{color:var(--text);text-decoration:none}
.p-year-amt{min-width:6.4em;text-align:right;font-weight:500}
.p-year-fill{background:var(--primary-ink)}
.p-year-sub{font:var(--small) var(--font);color:var(--text-muted)}
.p-trend-plot.is-compact{gap:.4em}
.p-trend-plot.is-compact .p-trend-col{min-width:0}
.p-trend-plot.is-compact .p-trend-val{display:none}
.p-trend-plot.is-compact .p-trend-col.is-active .p-trend-val{display:block;white-space:nowrap}
.p-trend-plot.is-compact .p-trend-label{font-size:.625rem}
.p-trend-plot.is-compact .p-trend-budget span{right:auto;left:0}

/* ===== Recurring ===== */
.p-rec-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8em}
.p-rec-li{display:grid;grid-template-columns:1fr auto;gap:.8em;align-items:center;padding:1.2em;background:var(--bg-light);border-radius:var(--r);box-shadow:var(--shadow)}
.p-rec-main{display:flex;flex-direction:column;gap:.4em;min-width:0}
.p-rec-name{color:var(--text);font-weight:700}
.p-rec-meta{font:var(--small) var(--font)}
.p-rec-li .p-row-actions{grid-column:1 / -1;justify-content:flex-end}
.p-rec-li.is-paused{opacity:.75;box-shadow:inset .4em 0 0 var(--border),var(--shadow)}

/* ===== Payment capture ===== */
.p-paste{display:flex;flex-direction:column;gap:.8em}
.p-paste label{display:flex;flex-direction:column;gap:.4em}
.p-paste-actions{display:flex;justify-content:flex-end;gap:.8em;flex-wrap:wrap}
.p-parse-preview:empty{display:none}
.p-parse-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;padding:.8em;background:var(--bg-dark);border-radius:var(--r);text-align:center}
.p-parse-preview span{display:block;font:var(--small) var(--font);color:var(--text-muted)}
.p-parse-preview strong{font-size:.875rem;overflow-wrap:anywhere}
.p-parse-preview.is-error{display:block;text-align:left;color:var(--danger);font-weight:600}
.p-inbox{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8em}
.p-pay-card{display:flex;flex-direction:column;gap:.8em;padding:1.2em;background:var(--bg-light);border-radius:var(--r-item);box-shadow:inset .4em 0 0 var(--info),var(--shadow);transition:transform .2s,opacity .2s}
.p-swipeable{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.p-pay-head{display:flex;justify-content:space-between;align-items:baseline;gap:.8em}
.p-pay-source{font:var(--small) var(--font);display:flex;align-items:center;gap:.4em}
.p-pay-amount{font:700 1.25rem/1.25 var(--font);color:var(--text)}
.p-pay-payee{color:var(--text);font-weight:700;margin-top:-.4em}
.p-pay-raw summary{min-height:var(--tap);display:flex;align-items:center;font:600 .75rem/1 var(--font);color:var(--primary-ink);cursor:pointer}
.p-pay-raw p{font:var(--small) var(--font);padding:.8em;background:var(--bg-dark);border-radius:var(--r);overflow-wrap:anywhere}
.p-pay-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:.8em}
.p-pay-card.is-new{animation:p-flash 1.2s ease}
@keyframes p-flash{0%{box-shadow:inset .4em 0 0 var(--info),0 0 0 3px var(--primary-ink)}100%{box-shadow:inset .4em 0 0 var(--info),var(--shadow)}}

/* ===== Admin hub (NEW COMPONENTS) ===== */
.p-admin-grid{display:grid;grid-template-columns:1fr;gap:.8em}
.p-admin-card{display:grid;grid-template-columns:auto 1fr auto;gap:.4em 1.2em;align-items:center;padding:1.2em;background:var(--gradient);border-radius:var(--r);box-shadow:var(--shadow);text-decoration:none;color:var(--text);transition:transform .2s}
.p-admin-icon{grid-row:span 2;display:grid;place-items:center;width:2.8em;height:2.8em;border-radius:var(--r);background:var(--tint);color:var(--primary-ink);font-size:1.125rem}
.p-admin-card b{font-size:.9375rem}
.p-admin-card .p-list-sub{grid-column:2}
.p-admin-status{grid-row:1 / span 2;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:.4em}
.p-admin-card.is-placeholder{border:1px dashed var(--border);background:var(--bg-dark);box-shadow:none;color:var(--text-muted)}
.p-kv{list-style:none;margin:0;padding:0 1.2em;background:var(--bg-light);border-radius:var(--r);box-shadow:var(--shadow)}
.p-kv li{display:flex;justify-content:space-between;align-items:center;gap:.8em;min-height:3.2em;padding:.8em 0;border-bottom:1px solid var(--border-muted);color:var(--text)}
.p-kv li:last-child{border-bottom:0}
.p-kv li>span:first-child{color:var(--text-muted)}
.p-filter-chips{display:flex;gap:.4em;flex-wrap:wrap}
.p-filter-chips button{min-height:36px;padding:0 1.2em;border-radius:999px;border:1px solid var(--border-muted);background:var(--bg-light);font-weight:600;color:var(--text-muted)}
.p-filter-chips button[aria-pressed="true"]{border-color:var(--primary-ink);color:var(--primary-ink);background:var(--tint)}
.p-log{list-style:none;margin:0;padding:0 1.2em;background:var(--bg-light);border-radius:var(--r);box-shadow:var(--shadow)}
.p-log li{display:grid;grid-template-columns:auto 1fr;gap:0 .8em;padding:.8em 0;border-bottom:1px solid var(--border-muted)}
.p-log li:last-child{border-bottom:0}
.p-log i{grid-row:span 2;margin-top:.4em;color:var(--primary-ink)}
.p-log b{font-weight:600}
.p-health{display:inline-flex;align-items:center;gap:.4em;font-weight:700}
.p-health.ok{color:var(--success)}.p-health.bad{color:var(--danger)}

/* ===== Account ===== */
.p-profile{display:flex;align-items:center;gap:1.2em}
.p-avatar{display:grid;place-items:center;width:3.2em;height:3.2em;flex:none;border-radius:50%;background:var(--primary-ink);color:var(--bg-light);font:700 1rem/1 var(--font)}
.p-pref-row{display:flex;align-items:center;justify-content:space-between;gap:.8em;min-height:3.6em;padding:.8em 1.2em}
.p-pref-row select{min-height:var(--tap);padding:0 .8em;font-size:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-light)}

/* ===== Auth and offline shell ===== */
.p-auth{min-height:calc(100dvh - 4em);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6em;padding-top:calc(2.4em + var(--safe-top))}
.p-auth-brand{display:flex;flex-direction:column;align-items:center;gap:.4em;text-align:center}
.p-auth-brand .p-logo-mark{display:grid;place-items:center;width:3.6em;height:3.6em;border-radius:var(--r-item);background:var(--text);color:var(--bg-light);font:700 1.5rem/1 var(--font);box-shadow:var(--shadow)}
.p-auth-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:1.2em;padding:1.6em;background:var(--bg);border-radius:var(--r-modal);box-shadow:var(--shadow)}
.p-auth-links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.8em}
.p-pass{position:relative}
.p-pass input{padding-right:3.2em}
.p-pass button{position:absolute;right:0;bottom:0;width:var(--tap);height:var(--tap);color:var(--text-muted)}
.p-offline-shell{text-align:center}
.p-offline-shell>i{font-size:3rem;color:var(--text-muted)}

/* ===== Toast ===== */
#pSnackBar{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 1.2em + var(--safe-bottom));z-index:90;display:flex;align-items:center;gap:.8em;width:max-content;max-width:calc(100% - 1.6em);min-height:var(--tap);padding:.4em .4em .4em 1.2em;border-radius:var(--r-item);background:var(--text);color:var(--bg-light);box-shadow:var(--shadow);font:600 .8125rem/1.4 var(--font);transform:translate(-50%,calc(100% + 8em));visibility:hidden;transition:transform .4s,visibility 0s .4s}
#pSnackBar.show{transform:translate(-50%,0);visibility:visible;transition:transform .4s}
#pSnackBar.success{background:var(--success)}#pSnackBar.error{background:var(--danger)}#pSnackBar.warning{background:var(--warning)}#pSnackBar.info{background:var(--info)}
#pSnackBar>span{padding:.4em 0}
#pSnackBar:not(:has(.p-toast-undo)){padding-right:1.2em}
.p-toast-undo{min-height:var(--tap);padding:0 1.2em;border-radius:var(--r);font-weight:800;text-decoration:underline;text-underline-offset:2px;color:inherit;background:color-mix(in srgb,var(--bg-light) 18%,transparent)}
body.p-bare #pSnackBar{bottom:calc(1.2em + var(--safe-bottom))}

/* ===== Prototype controls (not part of the product) ===== */
.p-dev-btn{position:fixed;right:0;top:40%;z-index:150;writing-mode:vertical-rl;padding:1.2em .4em;min-width:var(--tap);background:var(--tertiary);color:var(--bg-light);font:800 .6875rem/1 var(--font);letter-spacing:.1em;border-radius:var(--r) 0 0 var(--r);box-shadow:var(--shadow)}
.p-dev{position:fixed;top:0;right:0;bottom:0;z-index:160;width:min(320px,92vw);overflow-y:auto;padding:1.2em;background:var(--bg);color:var(--text);box-shadow:var(--shadow);border-left:1px solid var(--border);font:var(--small) var(--font);display:flex;flex-direction:column;gap:1.2em}
.p-dev[hidden]{display:none}
.p-dev-head{display:flex;justify-content:space-between;align-items:center}
.p-dev fieldset{border:1px solid var(--border-muted);border-radius:var(--r);padding:.8em;margin:0;display:flex;flex-direction:column;gap:.4em}
.p-dev legend{font-weight:700;padding:0 .4em}
.p-dev label{display:flex;align-items:center;gap:.8em;min-height:32px;cursor:pointer}
.p-dev-actions{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.p-dev-actions button{min-height:36px;padding:0 .8em;border-radius:var(--r);background:var(--bg-light);border:1px solid var(--border-muted);font-weight:600}
.p-dev-note{color:var(--text-muted)}

/* ===== Phone frame (prototype only) ===== */
body.p-framed{background:var(--border)}
body.p-framed #pApp{width:375px;height:812px;min-height:0;margin:2em auto;overflow:hidden;border-radius:2.4em;box-shadow:0 0 0 10px var(--text),var(--shadow);transform:translateZ(0);background:var(--bg-dark);--safe-top:47px;--safe-bottom:34px;scrollbar-width:none}
/* The frame itself never scrolls; only #pScroll does, so the tab bar, add button, toast and sheets stay put */
body.p-framed #pScroll{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
body.p-framed #pScroll::-webkit-scrollbar{display:none}
.p-statusbar{display:none}
body.p-framed .p-statusbar{display:flex;position:fixed;top:0;left:0;right:0;height:47px;align-items:center;justify-content:space-between;padding:0 2em;font:700 .875rem/1 var(--font);color:var(--bg-light);pointer-events:none;z-index:31}
body.p-framed:not(.p-standalone) .p-statusbar{color:var(--text)}
body.p-framed:not(.p-standalone) .p-header{margin-top:0}
body.p-framed:not(.p-standalone) #pApp::before{content:"bajeti.example";position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-end;justify-content:center;height:80px;padding-bottom:.8em;background:var(--bg-light);color:var(--text-muted);font:600 .75rem/1 var(--font);z-index:32;border-bottom:1px solid var(--border-muted)}
body.p-framed:not(.p-standalone) #pApp{--safe-top:0px}
body.p-framed:not(.p-standalone) #pScroll{margin-top:80px;height:calc(100% - 80px)}

/* ===== 768px+ (single breakpoint) ===== */
@container app (min-width:768px){
  #pMain{padding:1.6em 2.4em 4em calc(8em + var(--safe-left))}
  #pBanners .p-banner{padding-left:calc(8em + var(--safe-left))}
  .p-title-card{margin:-1.6em -2.4em 0 calc(-8em - var(--safe-left));padding:1.6em 2.4em 1.6em calc(8em + var(--safe-left))}
  .p-category-progress-list{display:none}
  .p-catbars{display:none}
  .p-category-rows{display:none}
  .p-table-wrap{display:block}
  .p-budget-cols{grid-template-columns:1fr 1fr}
  .p-stat-grid{grid-template-columns:repeat(3,1fr)}
  .p-stat:first-child{grid-column:auto}
  .p-admin-grid{grid-template-columns:repeat(2,1fr)}
  .p-two{grid-template-columns:1fr 1fr}
  .p-modal{align-items:center}
  .p-modal-content{max-width:440px;border-radius:var(--r-modal);padding:1.6em;transform:translateY(1.6em);opacity:.6;transition:transform .25s,opacity .2s}
  .p-modal.open .p-modal-content{opacity:1}
  .p-sheet-grip{display:none}
  .p-install{margin:1.2em 2.4em 0 calc(8em + var(--safe-left))}
  #pSnackBar{bottom:1.6em}
  .p-due-list{grid-template-columns:repeat(auto-fill,minmax(18em,1fr))}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== Prototype A "Evolve": bottom tab bar with a raised Add button ===== */
/* NEW COMPONENT: tab bar */
.p-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  min-height:calc(var(--tabbar-h) + var(--safe-bottom));padding:0 var(--safe-right) var(--safe-bottom) var(--safe-left);
  background:var(--bg-light);border-top:1px solid var(--border-muted);box-shadow:var(--shadow)}
.p-tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;min-height:var(--tabbar-h);
  color:var(--text-muted);text-decoration:none;font:500 .6875rem/1 var(--font)}
.p-tab i{font-size:1.125rem}
.p-tab[aria-current="page"]{color:var(--primary-ink)}
.p-tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:2.4em;height:3px;border-radius:0 0 3px 3px;background:var(--primary-ink)}
.p-tab-add-circle{display:grid;place-items:center;width:3.6em;height:3.6em;margin-top:-1.6em;border-radius:50%;background:var(--primary-ink);color:var(--bg-light);
  font-size:1.25rem;box-shadow:var(--shadow);border:4px solid var(--bg-light)}
.p-tab-add{color:var(--text)}

/* On Home the eye lives in the title card, as in the live app */
body[data-route="home"] .p-header .p-hbtn[data-act=eye]{display:none}
.p-header .p-hbtn{font-size:1rem}

/* Home: two columns at 768+ */
.p-home{display:flex;flex-direction:column;gap:1.2em}
.p-home-main,.p-home-side{display:flex;flex-direction:column;gap:1.2em;min-width:0}

@container app (min-width:768px){

function catStats(c,month=NOW){
  const d=D();
  const exps=c.expenses.filter(e=>e.month===month);
  const used=exps.reduce((s,e)=>s+e.amount,0);
  const tin=d.transfers.filter(t=>t.to===c.id&&t.month===month).reduce((s,t)=>s+t.amount,0);
  const tout=d.transfers.filter(t=>t.from===c.id&&t.month===month).reduce((s,t)=>s+t.amount,0);
  const avail=c.allocated+tin-tout, balance=Math.round((avail-used)*100)/100;
  const pct=avail>0?used/avail*100:(used>0?100:0);
  const status=balance<0?'exceeded':((balance===0&&avail>0)||avail===0)?'zero':'ok';
  return {exps,used,tin,tout,avail,balance,pct,status,savings:isSavings(c)};
}
function statusText(s,o={bare:true}){

  if(s.status==='zero')return 'Fully used';
  return `${money(s.balance,o)} left`;
}

}

/* ---------- Payment message parser (M-Pesa SMS and payment emails) ---------- */
function parseMessage(raw){
  const t=String(raw).replace(/\s+/g,' ').trim();
  const amt=t.match(/(?:Ksh|KES|KShs?)\.?\s?([\d,]+(?:\.\d{1,2})?)/i);
  const ref=t.match(/^([A-Z0-9]{8,12})\b/)||t.match(/\b(?:ref(?:erence)?|transaction(?:\s+id)?)\s*(?:no\.?|number)?\s*[:.#]?\s*([A-Z0-9]{6,14})\b/i);
  const payee=t.match(/\b(?:paid to|sent to|payment to)\s+(.+?)(?=\s+(?:on|for|account|acc\.?|via)\b|\.\s|\.$|,|$)/i);
  const dm=t.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
  let date=null;
  if(dm){const y=dm[3].length===2?'20'+dm[3]:dm[3];date=`${y}-${pad(dm[2])}-${pad(dm[1])}`;}
  return {amount:amt?parseFloat(amt[1].replace(/,/g,'')):null,payee:payee?payee[1].trim():null,reference:ref?ref[1].toUpperCase():null,date};
}
function suggestCategory(payee,d=D()){
  if(payee&&d.payees[payee]&&d.categories.some(c=>c.id===d.payees[payee]&&c.budgetId===d.activeBudget))return d.payees[payee];
  const rules=[[/grocer|supermarket|mart|market|duka/i,'Groceries'],[/pharm|clinic|hospital|chemist/i,'Health'],[/fuel|petrol|shell|rubis|matatu|taxi/i,'Transport'],[/power|water|internet|fibre|wifi/i,'Utilities'],[/cinema|movie|stream/i,'Entertainment']];
  const hit=rules.find(([re])=>re.test(payee||''));
  return hit?(d.categories.find(c=>c.name===hit[1]&&c.budgetId===d.activeBudget)?.id||null):null;
}

/* ---------- Mutations (optimistic; offline rules applied here) ---------- */
function needOnline(){if(S.online)return true;toast('You are offline. This change needs a connection, so it was not saved.',{type:'warning'});return false;}
function addExpense({categoryId,amount,description,date=TODAY,type='spend',ref}){
  const c=catById(categoryId);if(!c)throw new Gone('That category no longer exists.');
  const e={id:nid(),amount:+amount,month:date.slice(0,7),date,description:description||'Expense',type,pending:!S.online,ref};
  c.expenses.push(e);
  log('money',`Added ${type==='withdrawal'?'a withdrawal':'an expense'} to ${c.name}`,e.amount);
  if(S.failNext&&S.online){
    S.failNext=false;syncDev();
    setTimeout(()=>{c.expenses=c.expenses.filter(x=>x!==e);refresh();toast(`Couldn't save "${esc(e.description)}". It was removed; please try again.`,{type:'error'});},RM()?200:1400);
  }
  return {c,e};
}
function quickExpense(cid){
  const c=catById(cid);if(!c)return;
  if(!c.allocated){toast('This category has no allocation yet.',{type:'warning'});return;}
  const {e}=addExpense({categoryId:c.id,amount:c.allocated,description:'Quick expense'});
  refresh();
  toast(`Quick expense: ${money(e.amount)} to ${esc(c.name)}${e.pending?' (pending sync)':''}`,{type:'success',undo:()=>{c.expenses=c.expenses.filter(x=>x!==e);}});
}
function deleteExpense(cid,eid){
  const c=catById(cid);const e=c?.expenses.find(x=>x.id===+eid);if(!e)return;
  if(!e.pending&&!needOnline())return;
  const i=c.expenses.indexOf(e);c.expenses.splice(i,1);refresh();

function setActiveBudget(id){D().activeBudget=+id;refresh();}
function deleteBudget(id){
  if(!needOnline())return;
  const d=D(),b=budgetById(id),bi=d.budgets.indexOf(b),cats=d.categories.filter(c=>c.budgetId===b.id),wasActive=d.activeBudget===b.id;
  d.budgets.splice(bi,1);d.categories=d.categories.filter(c=>c.budgetId!==b.id);

  toast(`Deleted ${esc(b.name)} and its ${cats.length} categor${cats.length===1?'y':'ies'}`,{type:'warning',undo:()=>{d.budgets.splice(bi,0,b);d.categories.push(...cats);if(wasActive)d.activeBudget=b.id;}});

function deleteCategory(id){
  if(!needOnline())return;

function deleteTarget(cid){

  toast(`Removed targets for ${esc(c.name)}`,{undo:()=>{c.target=t;}});

function approveDue(id){
  const r=D().recurring.find(x=>x.id===+id);if(!r)return;
  const prev=r.next_due;
  const {c,e}=addExpense({categoryId:r.categoryId,amount:r.amount,description:r.name,date:r.next_due});
  r.next_due=addPeriod(r.next_due,r.every);refresh();
  toast(`${esc(r.name)} added to ${esc(c.name)} for ${monthName(e.month)}${e.pending?' (pending sync)':''}`,{type:'success',undo:()=>{c.expenses=c.expenses.filter(x=>x!==e);r.next_due=prev;}});
}
function skipDue(id){
  const r=D().recurring.find(x=>x.id===+id);if(!r)return;

function togglePause(id){

function capturePayment(raw){
  const parsed=parseMessage(raw);
  if(!parsed.amount)return {error:"Couldn't find an amount. Check the message contains something like Ksh450.00."};
  const d=D();
  if(parsed.reference&&(d.pending.some(p=>p.parsed.reference===parsed.reference)||d.categories.some(c=>c.expenses.some(e=>e.ref===parsed.reference))))
    return {error:`Already captured: reference ${esc(parsed.reference)} is in your inbox or expenses.`};
  const cid=suggestCategory(parsed.payee);
  const p={id:nid(),source:/^[A-Z0-9]{8,12}\s+Confirmed/i.test(raw.trim())?'mpesa_sms':'pasted',received:`${TODAY}T${NOW_TIME}:00`,raw:raw.trim(),parsed,categoryId:cid,suggested:!!cid,status:'needs_category',fresh:true};
  d.pending.unshift(p);log('money','Payment captured from a pasted message',parsed.amount);
  return {p};
}
function approvePending(id){
  const d=D(),p=d.pending.find(x=>x.id===+id);if(!p)return;
  const sel=$('#pPayCat'+p.id),cid=+(sel?.value||0);

  const remember=$('#pPayRem'+p.id)?.checked;

  const idx=d.pending.indexOf(p);d.pending.splice(idx,1);
  const {c,e}=addExpense({categoryId:cid,amount:p.parsed.amount,description:p.parsed.payee||'Payment',date:p.parsed.date||TODAY,ref:p.parsed.reference});
  refresh();
  toast(`Filed ${money(e.amount)} under ${esc(c.name)}${remember?' and remembered the payee':''}`,{type:'success',undo:()=>{c.expenses=c.expenses.filter(x=>x!==e);d.pending.splice(idx,0,p);}});
}

  const d=D(),idx=d.pending.findIndex(x=>x.id===+id);if(idx<0)return;
  const p=d.pending[idx];d.pending.splice(idx,1);refresh();
  toast(`Dismissed payment to ${esc(p.parsed.payee||'unknown payee')}`,{undo:()=>d.pending.splice(idx,0,p)});

/* ---------- Toast (snackbar with optional Undo) ---------- */
let toastTimer;

  if(undo)t.querySelector('.p-toast-undo').onclick=()=>{undo();hideToast();refresh();toast('Restored',{type:'info'});};

/* ---------- Sheets (modal): focus trap, Escape, backdrop tap ---------- */
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])';
const sheets=[];let sheetSeq=0;
function openSheet({title,render,mount,live,catId}){
  const id='pSheet'+(++sheetSeq);
  const m=document.createElement('div');
  m.className='p-modal p-sheet';
  m.innerHTML=`<div class="p-modal-content" role="dialog" aria-modal="true" aria-labelledby="${id}t" tabindex="-1">
    <div class="p-sheet-grip" aria-hidden="true"></div>
    <div class="p-modal-head"><h2 class="p-modal-limit-name" id="${id}t">${title}</h2>
      <button type="button" class="p-close" data-act="close-sheet" aria-label="Close"><i class="fa fa-xmark" aria-hidden="true"></i></button></div>
    <div class="p-modal-body"></div></div>`;
  const entry={m,render,mount,live,catId,prev:document.activeElement};
  $('#pApp').appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)closeSheet();});
  sheets.push(entry);paintSheet(entry);
  document.body.classList.add('p-modal-open');
  $('#pMain').setAttribute('aria-hidden','true');
  requestAnimationFrame(()=>{m.classList.add('open');const f=m.querySelector('.p-modal-body '+FOCUSABLE)||m.querySelector('.p-modal-content');f.focus({preventScroll:true});});
  return entry;
}
function paintSheet(entry){
  const body=entry.m.querySelector('.p-modal-body');
  const a=document.activeElement,inside=a&&entry.m.contains(a)&&a!==entry.m.querySelector('.p-close');
  const key=inside?{act:a.dataset?.act,id:a.dataset?.id,eid:a.id}:null;
  const keep=$$('input[name],select[name],textarea[name]',body).filter(x=>x.type!=='radio'||x.checked).map(x=>[x.name,x.type,x.value]);
  body.innerHTML=entry.render();
  keep.forEach(([n,t,v])=>{const sel=t==='radio'?`input[name="${n}"][value="${CSS.escape(v)}"]`:`[name="${n}"]`;const el=body.querySelector(sel);if(!el)return;if(t==='radio')el.checked=true;else if(t!=='hidden')el.value=v;});
  entry.mount&&entry.mount(entry.m,entry);
  if(key){
    const el=key.eid?entry.m.querySelector('#'+CSS.escape(key.eid)):key.act?entry.m.querySelector(`[data-act="${key.act}"]${key.id?`[data-id="${key.id}"]`:''}`):null;
    (el||entry.m.querySelector('.p-modal-content')).focus({preventScroll:true});
  }
}
function closeSheet(){
  const e=sheets.pop();if(!e)return;
  e.m.classList.remove('open');setTimeout(()=>e.m.remove(),RM()?0:220);
  if(!sheets.length){document.body.classList.remove('p-modal-open');$('#pMain').removeAttribute('aria-hidden');}
  const back=e.prev&&document.contains(e.prev)?e.prev:(sheets.length?sheets[sheets.length-1].m.querySelector('.p-modal-content'):$('#pMain'));
  back&&back.focus({preventScroll:true});
}
function closeAllSheets(){while(sheets.length)closeSheet();}
document.addEventListener('keydown',e=>{
  if(!sheets.length)return;
  const top=sheets[sheets.length-1].m;
  if(e.key==='Escape'){e.preventDefault();closeSheet();return;}
  if(e.key==='Tab'){
    const f=$$(FOCUSABLE,top).filter(x=>x.offsetParent!==null||x===document.activeElement);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(!top.contains(document.activeElement)){e.preventDefault();first.focus();}
    else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
function confirmSheet({title,message,ok='Confirm',danger,onOk}){
  openSheet({title,render:()=>`<p>${message}</p><div class="p-sheet-actions"><button type="button" class="p-modal-btn-secondary" data-act="close-sheet">Cancel</button><button type="button" class="${danger?'p-modal-btn-danger':'p-modal-btn-primary'}" data-confirm-ok>${ok}</button></div>`,
    mount:m=>{m.querySelector('[data-confirm-ok]').onclick=()=>{closeSheet();onOk();};}});
}

/* ---------- Router (hash based, with back behaviour) ---------- */
const ROUTES={};let DEFAULT_ROUTE='home';const navStack=[];
/* Navigation keeps its own state, so it works even where the page URL can't change
   (sandboxed previews, file viewers). The URL hash is updated when allowed, and the
   browser's back button is honoured when it is. */
let CUR='';
function parseHash(){
  const parts=CUR.split('/').filter(Boolean);
  if(parts[0]&&ROUTES[parts[0]])return {name:parts[0],params:parts.slice(1)};
  return {name:DEFAULT_ROUTE,params:[]};
}
class Gone extends Error{}
function safely(fn,label){try{return fn();}catch(err){console.error('[Bajeti prototype] '+label,err);closeAllSheets();refresh();toast(err instanceof Gone?err.message:'Something went wrong. Nothing was saved.',{type:'error'});}}
const pathFromLocation=()=>{try{return decodeURIComponent(location.hash.replace(/^#\/?/,''));}catch(_){return '';}};
function setUrl(path,replace){try{history[replace?'replaceState':'pushState'](null,'','#/'+path);}catch(_){}}
function navigate(path,{replace=false}={}){
  path=String(path||DEFAULT_ROUTE).replace(/^#?\/?/,'');
  if(replace&&navStack.length)navStack[navStack.length-1]=path;else navStack.push(path);
  CUR=path;setUrl(path,replace);closeAllSheets();renderRoute(true);
}
const go=path=>navigate(path);
function goBack(){
  if(navStack.length>1){navStack.pop();CUR=navStack[navStack.length-1];setUrl(CUR,true);closeAllSheets();renderRoute(true);}
  else{const r=ROUTES[S.route.name];navigate(r.parent?r.parent(...S.route.params):(APP.parents[S.route.name]||DEFAULT_ROUTE),{replace:true});}
}
function syncFromLocation(){
  const p=pathFromLocation();if(!p||p===CUR)return;
  if(navStack[navStack.length-2]===p)navStack.pop();else navStack.push(p);
  CUR=p;closeAllSheets();renderRoute(true);
}
window.addEventListener('popstate',syncFromLocation);
window.addEventListener('hashchange',syncFromLocation);
const routeTitle=(r,params)=>typeof r.title==='function'?r.title(...params):r.title;
function renderRoute(reset){
  const {name,params}=parseHash();S.route={name,params};
  const r=ROUTES[name];
  let html;
  if(!r.bare&&S.view==='loading')html=skeleton();
  else if(!r.bare&&S.view==='error')html=errorState(routeTitle(r,params));
  else html=r.render(...params);
  APP.shell(r,params);
  const main=$('#pMain');main.innerHTML=html;
  main.setAttribute('aria-busy',String(!r.bare&&S.view==='loading'));
  document.title=`${routeTitle(r,params)} \u00b7 Bajeti`;
  if(reset){scrollRoot().scrollTop=0;main.focus({preventScroll:true});}
  r.after&&r.after(...params);
  updateChrome();
}
const scrollRoot=()=>S.frame?$('#pScroll'):(document.scrollingElement||document.documentElement);
function refresh(){
  const y=scrollRoot().scrollTop;
  renderRoute(false);
  scrollRoot().scrollTop=y;
  sheets.forEach(s=>{if(s.live)paintSheet(s);});
}

function yearView(year){

  const total=rows.reduce((s,r)=>s+r.total,0),max=rows[0]?.total||1,ow=outWord();

    <div class="p-stat"><span class="p-stat-label">${ow} · ${shortMonth(months[0])}–${shortMonth(months[months.length-1])}</span><strong class="p-stat-value">${money(total,{dec:0})}</strong><span class="p-small">${esc(b.name)}, ${months.length} months</span></div>

function analyticsView(month,catId){

  if(catId)return analyticsCategory(month,+catId);
  const months=monthsWithData(),i=months.indexOf(month),prevM=prevMonth(month);
  const spent=monthSpend(month),prev=monthSpend(prevM),budgeted=monthBudgeted(),diff=spent-prev,pctDiff=prev?diff/prev*100:null;
  const sav=scopeSavings(),bn=esc(activeBudget().name);
  const rows=byCategory(month);
  const movers=rows.map(r=>({...r,prev:spendIn(prevM,c=>c.id===r.c.id)})).map(r=>({...r,delta:r.spent-r.prev})).filter(r=>r.delta).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,3);
  return `<div class="p-page p-analytics">${scopeBar('Showing')}${periodNav('month')}
  <div class="p-month-nav"><button type="button" class="p-actions-btns p-actions-btns-primary" data-act="month-step" data-step="-1" ${i<=0?'disabled':''} aria-label="Previous month"><i class="fa fa-chevron-left" aria-hidden="true"></i></button>
  <h1 class="p-month-title">${monthLabel(month)}</h1><button type="button" class="p-actions-btns p-actions-btns-primary" data-act="month-step" data-step="1" ${month>=NOW?'disabled':''} aria-label="Next month"><i class="fa fa-chevron-right" aria-hidden="true"></i></button></div>
  <section class="p-stat-grid" aria-label="Month totals">
    <div class="p-stat"><span class="p-stat-label">${outWord()} · ${bn}</span><strong class="p-stat-value">${money(spent)}</strong><span class="p-small">${sav?`Withdrawals from ${bn} this month.`:`Spending in ${bn} only. Other budgets and savings withdrawals are not counted.`}</span></div>
    <div class="p-stat"><span class="p-stat-label">Budgeted</span><strong class="p-stat-value">${money(budgeted,{bare:true})}</strong><span class="p-small">${budgeted?(spent/budgeted*100).toFixed(0)+'% used \u00b7 ':''}${spent<=budgeted?money(budgeted-spent,{bare:true})+' left':money(spent-budgeted,{bare:true})+' over'}</span></div>
    <div class="p-stat"><span class="p-stat-label">vs ${monthName(prevM)}</span><strong class="p-stat-value ${pctDiff===null?'':diff>0?'p-up':'p-down'}">${pctDiff===null?'No data':`<i class="fa ${diff>0?'fa-arrow-trend-up':'fa-arrow-trend-down'}" aria-hidden="true"></i> ${Math.abs(pctDiff).toFixed(0)}% ${diff>0?'more':'less'}`}</strong><span class="p-small">${prev?`${money(Math.abs(diff),{bare:true})} ${diff>0?'more':'less'} than ${money(prev,{bare:true})}`:'Nothing recorded last month'}</span></div>

  <section class="p-card"><div class="p-section-head"><h2>${sav?'Withdrawals':'Spending'} by month</h2><span class="p-small">Tap a month</span></div>${trendChart(months.slice(-6),month,budgeted,monthSpend,m=>`analytics/${m}`,`${bn}: ${sav?'withdrawals':'spending'} by month compared with the budget`)}</section>
  <section class="p-card"><div class="p-section-head"><h2>Budget vs actual</h2><span class="p-small">Tap for expenses</span></div>${rows.some(r=>r.spent||r.allocated)?`<ul class="p-breakdown">${rows.map(r=>breakdownRow(r,month,spent)).join('')}</ul>`:'<p class="p-category-progress-no-content">No spending this month.</p>'}</section>
  ${movers.length?`<section class="p-card"><div class="p-section-head"><h2>Biggest changes vs ${monthName(prevM)}</h2></div><ul class="p-category-progress-ul">${movers.map(r=>`<li class="p-category-progress-li"><span><b>${esc(r.c.name)}</b><small>${money(r.prev,{bare:true})} \u2192 ${money(r.spent,{bare:true})}</small></span><span class="${r.delta>0?'p-up':'p-down'}"><i class="fa ${r.delta>0?'fa-arrow-up':'fa-arrow-down'}" aria-hidden="true"></i> ${money(Math.abs(r.delta),{bare:true})} ${r.delta>0?'more':'less'}</span></li>`).join('')}</ul></section>`:''}

  const ih=installHtml();if(ih!==lastInstall){$('#pInstall').innerHTML=ih;lastInstall=ih;}
  $$('[data-act=eye]:is(.p-hbtn,.p-eye-toggle)').forEach(b=>{b.setAttribute('aria-pressed',String(S.hidden));b.setAttribute('aria-label',S.hidden?'Show amounts':'Hide amounts');b.title=S.hidden?'Show amounts':'Hide amounts';const i=b.querySelector('i');if(i)i.className='fa '+(S.hidden?'fa-eye-slash':'fa-eye');});
  APP.chrome&&APP.chrome();
}
function setTheme(t){
  S.theme=t;[document.documentElement,document.body].forEach(el=>el.classList.toggle('light',t==='light'));
  const m=$('#pThemeColor');if(m)m.content=getComputedStyle(document.body).getPropertyValue('--text').trim()||'#141821';
  syncDev();
}
function setHidden(v){S.hidden=v;document.body.classList.toggle('p-values-hidden',v);refresh();syncDev();}
function setOnline(v){
  if(v===S.online)return;S.online=v;syncDev();
  if(v){
    const n=pendingSync();
    if(n){S.syncing=true;refresh();setTimeout(()=>{D().categories.forEach(c=>c.expenses.forEach(e=>{e.pending=false;}));S.syncing=false;S.lastSync=NOW_TIME;refresh();toast(`${n} expense${n>1?'s':''} synced`,{type:'success'});},RM()?300:1600);}
    else{refresh();toast('Back online',{type:'success'});}
  }else refresh();
}
function simulateLoad(ms=700){S.view='loading';syncDev();renderRoute(false);setTimeout(()=>{S.view='default';syncDev();renderRoute(false);},RM()?80:ms);}
function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

const CHANGE={currency:el=>{S.currency=el.value;refresh();}};
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#/"]');
  if(a&&!e.defaultPrevented&&!e.metaKey&&!e.ctrlKey){e.preventDefault();navigate(a.getAttribute('href'));return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.tagName==='A')e.preventDefault();
  safely(()=>fn(el,e),'action '+el.dataset.act);
});
