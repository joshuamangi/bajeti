/* ---------- Swipe to dismiss (cards also have buttons) ---------- */
function initSwipe(){
  let st=null;const app=$('#pApp');
  app.addEventListener('pointerdown',e=>{const card=e.target.closest('.p-swipeable');if(!card||e.target.closest('button,select,input,summary,a,label,textarea,details'))return;st={card,x:e.clientX,y:e.clientY,dx:0,id:e.pointerId,active:false};});
  app.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.active){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5){st.active=true;try{st.card.setPointerCapture(e.pointerId);}catch(_){}}else if(Math.abs(dy)>12){st=null;return;}else return;}
    st.dx=Math.min(0,dx);st.card.style.transform=`translateX(${st.dx}px)`;st.card.style.opacity=String(Math.max(.3,1+st.dx/300));
  });
  const end=()=>{if(!st)return;const {card,dx,active}=st;st=null;if(!active)return;card.style.transform='';card.style.opacity='';if(dx<-110)ACT[card.dataset.swipe]?.(card);};
  app.addEventListener('pointerup',end);app.addEventListener('pointercancel',end);
}

/* ---------- Prototype controls (dev panel) ---------- */
function buildDev(){
  const btn=document.createElement('button');btn.className='p-dev-btn';btn.type='button';btn.textContent='CONTROLS';btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-controls','pDev');
  const el=document.createElement('aside');el.id='pDev';el.className='p-dev';el.hidden=true;el.setAttribute('aria-label','Prototype controls');
  el.innerHTML=`<div class="p-dev-head"><strong>Prototype controls</strong><button type="button" class="p-close" data-dev="close" aria-label="Close controls"><i class="fa fa-xmark" aria-hidden="true"></i></button></div>
  <p class="p-dev-note">Not part of the product. Changes apply to the screen you're on and every other screen.</p>
  <fieldset><legend>Screen state</legend>${['default','empty','loading','error'].map(v=>`<label><input type="radio" name="pDevView" value="${v}"> ${cap(v)}</label>`).join('')}</fieldset>
  <fieldset><legend>Toggles</legend>
    <label><input type="checkbox" data-dev="hidden"> Values hidden</label><label><input type="checkbox" data-dev="dark"> Dark theme</label>
    <label><input type="checkbox" data-dev="offline"> Offline</label><label><input type="checkbox" data-dev="frame"> iPhone frame (375 \u00d7 812)</label>
    <label><input type="checkbox" data-dev="standalone"> Installed (standalone)</label><label><input type="checkbox" data-dev="member"> Signed in as member</label>
    <label><input type="checkbox" data-dev="fail"> Fail the next save</label></fieldset>
  <fieldset><legend>Install hint platform</legend>${['ios','android','desktop'].map(p=>`<label><input type="radio" name="pDevPlat" value="${p}"> ${p==='ios'?'iOS':cap(p)}</label>`).join('')}</fieldset>
  <div class="p-dev-actions"><button type="button" data-dev="update">Update banner</button><button type="button" data-dev="install">Install hint</button><button type="button" data-dev="shell">Offline shell</button><button type="button" data-dev="login">Login page</button><button type="button" data-dev="reset">Reset data</button></div>
  <p class="p-dev-note">Resize the window past 768px (or turn off the frame) to see the wide layout.</p>`;
  document.body.append(btn,el);
  const open=v=>{el.hidden=!v;btn.setAttribute('aria-expanded',String(v));if(v)el.querySelector('input').focus();else btn.focus();};
  btn.onclick=()=>open(el.hidden);
  el.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();open(false);}});
  el.addEventListener('change',e=>{
    const t=e.target;
    if(t.name==='pDevView'){S.view=t.value;closeAllSheets();renderRoute(false);return;}
    if(t.name==='pDevPlat'){S.platform=t.value;S.showInstall=true;updateChrome();return;}
    const k=t.dataset.dev;
    if(k==='hidden')setHidden(t.checked);
    if(k==='dark'){setTheme(t.checked?'dark':'light');refresh();}
    if(k==='offline')setOnline(!t.checked);
    if(k==='frame'){S.frame=t.checked;document.body.classList.toggle('p-framed',t.checked);refresh();}
    if(k==='standalone'){S.standalone=t.checked;document.body.classList.toggle('p-standalone',t.checked);updateChrome();}
    if(k==='member'){S.data.user.role=t.checked?'member':'owner';refresh();}
    if(k==='fail'){S.failNext=t.checked;}
  });
  el.addEventListener('click',e=>{
    const k=e.target.closest('[data-dev]')?.dataset.dev;if(!k||e.target.closest('input'))return;
    if(k==='close')open(false);
    if(k==='update'){S.showUpdate=true;updateChrome();}
    if(k==='install'){S.showInstall=true;S.standalone=false;document.body.classList.remove('p-standalone');go(DEFAULT_ROUTE);updateChrome();syncDev();}
    if(k==='shell')go('offline');
    if(k==='login')go('login');
    if(k==='reset'){S.data=seed();EMPTY=null;S.view='default';S.dismissed={};closeAllSheets();refresh();syncDev();toast('Fake data reset');}
  });
}
function syncDev(){
  const el=$('#pDev');if(!el)return;
  $$('input[name=pDevView]',el).forEach(i=>{i.checked=i.value===S.view;});
  $$('input[name=pDevPlat]',el).forEach(i=>{i.checked=i.value===S.platform;});
  const set=(k,v)=>{const i=el.querySelector(`[data-dev="${k}"]`);if(i)i.checked=v;};
  set('hidden',S.hidden);set('dark',S.theme==='dark');set('offline',!S.online);set('frame',S.frame);set('standalone',S.standalone);set('member',S.data.user.role!=='owner');set('fail',S.failNext);
}

/* ---------- Boot ---------- */
function boot(){
  S.data=seed();
  buildDev();
  S.standalone=!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  document.body.classList.toggle('p-standalone',S.standalone);
  const ua=navigator.userAgent||'';S.platform=/android/i.test(ua)?'android':/iphone|ipad/i.test(ua)?'ios':S.platform;
  setTheme(S.theme);
  if(navigator.onLine===false)S.online=false;
  window.addEventListener('online',()=>setOnline(true));
  window.addEventListener('offline',()=>setOnline(false));
  initSwipe();
  CUR=pathFromLocation()||DEFAULT_ROUTE;navStack.push(CUR);setUrl(CUR,true);
  S.hidden=S.hideByDefault;
  S.view='loading';renderRoute(true);
  setTimeout(()=>{S.view='default';renderRoute(false);syncDev();},RM()?60:650);
}

  shell(r,params){
    const top=r.top&&(r.isTop?r.isTop(...params):!params.length);

    document.body.dataset.route=S.route.name;

    $$('.p-tab[data-tab]').forEach(t=>{if(t.dataset.tab===tab)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});

    const rf=$('.p-header [data-act=refresh]');if(rf){rf.setAttribute('aria-label',`Refresh. Last updated ${S.lastSync}`);rf.title=`Refresh (updated ${S.lastSync})`;}
