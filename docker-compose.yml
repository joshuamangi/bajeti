services:
  bajeti_app:
    build: .
    container_name: bajeti_app
    ports:
      # Published on the host loopback only. cloudflared reaches the app over the
      # Docker network (http://bajeti_app:8000), so the LAN does not need this port.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data                     # persist entire data folder
      - ./app/templates:/app/app/templates:ro   # hot-reload templates
      - ./app/static:/app/app/static:ro         # static files
    env_file:
      - .env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - bajeti-net

  # Cloudflare tunnel
  cloudflared:
    # Pinned to the release that was running (same digest as :latest on 2025-10-17).
    # To upgrade: pick a newer release tag, change it here in a PR, then run
    # `docker compose up -d cloudflared` on the Pi and check the tunnel.
    image: cloudflare/cloudflared:2025.9.1
    container_name: cloudflared
    restart: unless-stopped
    user: "0"  # run as root so it can read certs
    command: tunnel --config /root/.cloudflared/config.yml run bajeti
    volumes:
      - ./cloudflared:/root/.cloudflared
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - bajeti_app
    networks:
      - bajeti-net

networks:
  bajeti-net:
    driver: bridge
