{% extends "base.html" %}

{% block title %}More{% endblock %}

{% block content %}
<div class="p-page">
  <h1>More</h1>

  <section>
    <h2 class="p-group-title">You</h2>
    <ul class="p-list">
      <li><a class="p-list-row" href="/profile"><span class="p-list-icon"><i class="fa fa-user" aria-hidden="true"></i></span><span class="p-list-main"><b>Account</b><span class="p-list-sub">Profile, security question and sessions</span></span><i class="fa fa-chevron-right p-chev" aria-hidden="true"></i></a></li>
    </ul>
  </section>

  <section>
    <h2 class="p-group-title">App</h2>
    <ul class="p-list">
      <li class="p-pref-row">
        <span class="p-list-main"><b id="pThemeLbl">Dark theme</b><span class="p-list-sub">Light is the default</span></span>
        <button type="button" role="switch" aria-checked="false" class="p-switch" data-act="theme" aria-labelledby="pThemeLbl"><span class="p-switch-track" aria-hidden="true"></span><span class="p-switch-text" aria-hidden="true">Off</span></button>
      </li>
    </ul>
  </section>

  <a class="p-btn-danger p-btn-block" href="/logout"><i class="fa fa-right-from-bracket" aria-hidden="true"></i> Log out</a>
</div>
{% endblock %}
