{% extends "base_auth.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<form method="POST" action="/login" class="p-auth-card">
  <label class="p-field"><span>Email</span><input name="username" type="email" autocomplete="username" required></label>
  <div class="p-field">
    <label for="pPassword">Password</label>
    <div class="p-pass">
      <input id="pPassword" name="password" type="password" autocomplete="current-password" required>
      <button type="button" data-act="toggle-pass" aria-label="Show password" aria-pressed="false"><i class="fa fa-eye" aria-hidden="true"></i></button>
    </div>
  </div>
  <button type="submit" class="p-btn-primary p-btn-block">Log in</button>
  <div class="p-auth-links">
    <a class="p-link" href="/forgot_password">Forgot password?</a>
    {% if registration_open() %}<a class="p-link" href="/register">Create account</a>{% endif %}
  </div>
</form>
{% endblock %}
