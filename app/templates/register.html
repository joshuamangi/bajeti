{% extends "base_auth.html" %}

{% block title %}Create account{% endblock %}
{% block subtitle %}Create an account{% endblock %}

{% block content %}
<form method="POST" action="/register" class="p-auth-card" data-match="password,confirm_password">
  <div class="p-form-row">
    <label class="p-field"><span>First name</span><input name="first_name" value="{{ first_name | default('') }}" autocomplete="given-name" required></label>
    <label class="p-field"><span>Last name</span><input name="last_name" value="{{ last_name | default('') }}" autocomplete="family-name" required></label>
  </div>
  <label class="p-field"><span>Email</span><input name="email" type="email" value="{{ email | default('') }}" autocomplete="email" required></label>
  <label class="p-field"><span>Security question: what was your childhood best friend's name?</span><input name="security_answer" autocomplete="off" required></label>
  <div class="p-field">
    <label for="pPassword">Password</label>
    <div class="p-pass">
      <input id="pPassword" name="password" type="password" autocomplete="new-password" required>
      <button type="button" data-act="toggle-pass" aria-label="Show password" aria-pressed="false"><i class="fa fa-eye" aria-hidden="true"></i></button>
    </div>
  </div>
  <label class="p-field"><span>Confirm password</span><input name="confirm_password" type="password" autocomplete="new-password" required></label>
  <p class="p-error-text" data-err aria-live="polite"></p>
  <button type="submit" class="p-btn-primary p-btn-block">Create account</button>
  <a class="p-link" href="/login">I already have an account</a>
</form>
{% endblock %}
