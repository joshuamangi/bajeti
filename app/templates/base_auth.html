{# templates/base_auth.html: signed-out pages (Prototype A auth screens) #}
<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Bajeti{% endblock %} · Bajeti</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141821" id="pThemeColor">
    <script>
      (function () {
        var theme = "light";
        try { theme = localStorage.getItem("bajeti-theme") || "light"; } catch (e) {}
        document.documentElement.classList.toggle("light", theme === "light");
      })();
    </script>
    <link rel="stylesheet" href="{{ asset('css/font.css') }}">
    <link rel="stylesheet" href="{{ asset('vendor/fontawesome/fontawesome-free-6.4.0-web/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ asset('css/palette.css') }}">
    <link rel="stylesheet" href="{{ asset('css/app.css') }}">
  </head>
  <body class="p-bare">
    <div id="pApp">
      <main id="pMain" tabindex="-1">
        <div class="p-auth">
          <div class="p-auth-brand"><span class="p-logo-mark" aria-hidden="true">B</span><h1>Bajeti</h1><p>{% block subtitle %}Household budgets, calmly.{% endblock %}</p></div>
          {% if error %}
          <div class="p-alert-error p-auth-alert" role="alert"><i class="fa fa-circle-exclamation" aria-hidden="true"></i><p>{{ error }}</p></div>
          {% endif %}
          {% block content %}{% endblock %}
        </div>
      </main>
      <div id="pSnackBar" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script src="{{ asset('js/app.js') }}" defer></script>
  </body>
</html>
